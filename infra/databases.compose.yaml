services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: fixture_admin_only, POSTGRES_DB: workbench_test}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workbench_test"]
      interval: 5s
      retries: 12
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: fixture_admin_only, MYSQL_DATABASE: workbench_test}
    ports: ["127.0.0.1:53306:3306"]
    volumes: ["./mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfixture_admin_only"]
      interval: 5s
      retries: 20
